name: OpenWrt XMC TL-WR840N V6.2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-wr840n-xmc.yml"
      - "source/openwrt-19.07-tl-wr840n-v6.x-main.zip"
      - "reference/XM25QH32D-datasheet.pdf"
      - "reference/XM25QH32D-driver-verification.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      XMC_SPI_NOR_VERIFIED: ${{ vars.XMC_SPI_NOR_VERIFIED }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install OpenWrt 19.07 build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses5-dev libssl-dev python2.7 rsync unzip zlib1g-dev file wget \
            subversion time xsltproc libelf-dev ecj fastjar java-propose-classpath
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python

      - name: Extract pinned project source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="source/openwrt-19.07-tl-wr840n-v6.x-main.zip"
          test -s "$archive"
          mkdir -p build
          unzip -q "$archive" -d build
          mapfile -t markers < <(find build -type f -path '*/include/toplevel.mk' -print)
          test "${#markers[@]}" -eq 1
          root="${markers[0]%/include/toplevel.mk}"
          test -f "$root/include/toplevel.mk"
          openwrt_dir="$(realpath "$root")"
          case "$openwrt_dir" in
            "$PWD"/build/*) ;;
            *) echo "OpenWrt root resolves outside extraction directory: $openwrt_dir" >&2; exit 1 ;;
          esac
          echo "OPENWRT_DIR=$openwrt_dir" >> "$GITHUB_ENV"
          sha256sum "$archive" | tee build/source-SHA256SUMS.txt

      - name: Check target metadata and exact patch order
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_DIR"
          test -f target/linux/generic/pending-4.14/480-mtd-spi-nor-add-xmc-xm25qh32d.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("target/linux/generic/pending-4.14")
          expected = [
              "478-mtd-spi-nor-Add-support-for-XM25QH64A-and-XM25QH128A.patch",
              "479-mtd-spi-nor-add-eon-en25qh32.patch",
              "479-mtd-spi-nor-add-eon-en25qh64.patch",
              "480-mtd-set-rootfs-to-be-root-dev.patch",
              "480-mtd-spi-nor-add-xmc-xm25qh32d.patch",
              "481-mtd-spi-nor-add-support-for-Gigadevice-GD25D05.patch",
          ]
          matches = sorted(x.name for x in p.glob("[0-9]*"))
          relevant = [n for n in matches if n.startswith(("478", "479", "480", "481"))]
          for name in expected:
              if name not in relevant:
                  raise SystemExit("Patch series differs; expected file missing: " + name)
          actual_order = [n for n in relevant if n in expected]
          if actual_order != expected:
              raise SystemExit("Patch lexical application order differs: " + repr(actual_order))
          print("Relevant patch lexical order:")
          for name in relevant:
              print(name)
          print("Expected XMC patch follows 478/479 and precedes 481.")
          PY
          grep -Fq '{ "XM25QH32D", INFO(0x204016, 0, 64 * 1024, 64, SECT_4K) },' \
            target/linux/generic/pending-4.14/480-mtd-spi-nor-add-xmc-xm25qh32d.patch
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("target/linux/ramips/image/mt76x8.mk")
          lines = path.read_text().splitlines()
          marker = "define Device/tl-wr840n-v6.2"
          starts = [i for i, line in enumerate(lines) if line.strip() == marker]
          if len(starts) != 1:
              raise SystemExit(f"Expected exactly one {marker!r}, found {len(starts)}")
          start = starts[0]
          ends = [i for i in range(start + 1, len(lines)) if lines[i].strip() == "endef"]
          if not ends:
              raise SystemExit(f"Profile at line {start + 1} has no endef")
          block = lines[start:ends[0] + 1]

          expected = {
              "TPLINK_FLASHLAYOUT": "4Mmtk",
              "TPLINK_HWID": "0x08400006",
              "TPLINK_HWREV": "0x1",
              "TPLINK_HWREVADD": "0x7",
              "TPLINK_HVERSION": "3",
              "IMAGE_SIZE": "3968k",
          }
          for key, value in expected.items():
              pattern = rf"^\s*{re.escape(key)}\s*:=\s*{re.escape(value)}\s*$"
              if sum(bool(re.match(pattern, line)) for line in block) != 1:
                  raise SystemExit(f"Profile must define {key} := {value} exactly once")

          print("Validated profile block:")
          print("\n".join(block))
          PY

      - name: Generate device config from source Kconfig metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_DIR"
          make defconfig
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("tmp/.config-target.in")
          if not p.is_file():
              raise SystemExit("OpenWrt did not generate tmp/.config-target.in")
          data = p.read_text()
          blocks = re.split(r"(?=^(?:menuconfig|config) )", data, flags=re.M)
          found = []
          for block in blocks:
              m = re.match(r"(?:menuconfig|config) (TARGET_DEVICE_[A-Za-z0-9_]+)", block)
              if m and re.search(r'bool "TP-Link TL-WR840N v6\.2"', block):
                  found.append(m.group(1))
          if len(found) != 1:
              raise SystemExit("Could not derive one unique profile symbol from Kconfig: " + repr(found))
          symbol = found[0]
          print("Source-generated target profile symbol:", symbol)
          Path("/tmp/wr840n-device-symbol").write_text(symbol)
          PY
          device_symbol="$(cat /tmp/wr840n-device-symbol)"
          cat > .config <<EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_${device_symbol}=y
          EOF
          make defconfig
          grep -qx 'CONFIG_TARGET_ramips=y' .config
          grep -qx 'CONFIG_TARGET_ramips_mt76x8=y' .config
          grep -qx "CONFIG_${device_symbol}=y" .config
          cp .config "$GITHUB_WORKSPACE/config.seed.generated"

      - name: Install source feeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare kernel and prove XMC patch application
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_DIR"
          make target/linux/prepare V=s
          mapfile -t spi_files < <(find build_dir -type f -path '*/drivers/mtd/spi-nor/spi-nor.c' -print)
          test "${#spi_files[@]}" -eq 1
          spi="${spi_files[0]}"
          grep -Fq '"XM25QH32D"' "$spi"
          grep -Fq 'INFO(0x204016, 0, 64 * 1024, 64, SECT_4K)' "$spi"
          echo "Prepared kernel source contains the XMC JEDEC entry: $spi"
          cp "$spi" "$GITHUB_WORKSPACE/spi-nor.prepared.c"

      - name: Stop before final build unless XMC driver is verified
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$XMC_SPI_NOR_VERIFIED" != "true" ]]; then
            echo "::error::XMC driver is not verified. Kernel preparation confirmed patch application, but final compilation is gated."
            echo "Required: repository variable XMC_SPI_NOR_VERIFIED=true, datasheet PDF and reviewed verification record."
            exit 1
          fi
          test -s "$GITHUB_WORKSPACE/reference/XM25QH32D-datasheet.pdf"
          test -s "$GITHUB_WORKSPACE/reference/XM25QH32D-driver-verification.md"
          grep -Eq '^Status: VERIFIED$' "$GITHUB_WORKSPACE/reference/XM25QH32D-driver-verification.md"

      - name: Compile kernel and verify compiled SPI-NOR object
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_DIR"
          make target/linux/compile V=s
          mapfile -t objects < <(find build_dir -type f -path '*/drivers/mtd/spi-nor/spi-nor.o' -print)
          test "${#objects[@]}" -eq 1
          strings -a "${objects[0]}" | grep -Fxq XM25QH32D
          sha256sum "${objects[0]}" | tee "$GITHUB_WORKSPACE/spi-nor-object-SHA256SUMS.txt"
          cp "${objects[0]}" "$GITHUB_WORKSPACE/spi-nor.o"

      - name: Build selected firmware images
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_DIR"
          make -j2 V=s
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin/targets/ramips/mt76x8 -maxdepth 1 -type f \
            \( -name '*tl-wr840n-v6.2*sysupgrade.bin' -o -name '*tl-wr840n-v6.2*tftp-recovery.bin' -o -name '*tl-wr840n-v6.2*factory.bin' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          python3 "$GITHUB_WORKSPACE/scripts/validate-wr840n-xmc-images.py" \
            "$GITHUB_WORKSPACE/artifacts"
          (cd "$GITHUB_WORKSPACE/artifacts" && sha256sum *.bin > SHA256SUMS)
          cp .config "$GITHUB_WORKSPACE/artifacts/config.seed.generated"

      - name: Upload build evidence and firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr840n-xmc-build-evidence
          path: |
            build/source-SHA256SUMS.txt
            config.seed.generated
            spi-nor.prepared.c
            spi-nor.o
            spi-nor-object-SHA256SUMS.txt
            artifacts/
          if-no-files-found: warn
          retention-days: 30
