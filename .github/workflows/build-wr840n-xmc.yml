
name: Build WR840N V6.2 XMC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev \
            python3 python3-distutils rsync unzip \
            zlib1g-dev file wget perl libelf-dev \
            ecj fastjar

      - name: Extract OpenWrt source
        run: |
          mkdir -p work
          unzip -q source/openwrt-19.07-tl-wr840n-v6.x-main.zip -d work

          ROOT="$(find work -mindepth 1 -maxdepth 1 -type d | head -1)"

          if [ -z "$ROOT" ]; then
            echo "Source tidak ditemukan"
            exit 1
          fi

          echo "OPENWRT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify XMC patch
        run: |
          cd "$OPENWRT_ROOT"

          find target/linux -name '*xm25qh32d*.patch'

          if ! grep -R -q '0x204016' target/linux; then
            echo "ERROR: Patch XMC tidak ditemukan"
            exit 1
          fi

          echo "XMC JEDEC ID ditemukan"

      - name: Configure WR840N V6.2
        run: |
          cd "$OPENWRT_ROOT"

          cp "$GITHUB_WORKSPACE/config.seed" .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          make defconfig

          grep -q '^CONFIG_TARGET_ramips=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt76x8=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt76x8_DEVICE_tl-wr840n-v6_2=y' .config

      - name: Prepare kernel
        run: |
          cd "$OPENWRT_ROOT"
          make target/linux/prepare V=s

      - name: Compile firmware
        run: |
          cd "$OPENWRT_ROOT"
          make -j2 V=s

      - name: Collect firmware
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          IMAGE_DIR="$OPENWRT_ROOT/bin/targets/ramips/mt76x8"

          find "$IMAGE_DIR" -maxdepth 1 -type f \
            \( -name '*wr840n*v6.2*sysupgrade.bin' \
            -o -name '*wr840n*v6.2*tftp-recovery.bin' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;

          test -n "$(find "$GITHUB_WORKSPACE/output" -name '*.bin' -print -quit)"

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: WR840N-V6.2-XMC-Firmware
          path: output/*.bin
          if-no-files-found: error
          retention-days: 30
