
name: Build WR840N V6.2 XMC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev \
            python2 python2.7 python3 python3-distutils \
            rsync unzip zlib1g-dev file wget perl \
            libelf-dev ecj fastjar java-propose-classpath

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          python --version
          python2 --version

      - name: Extract OpenWrt source
        run: |
          mkdir -p work
          unzip -q source/openwrt-19.07-tl-wr840n-v6.x-main.zip -d work

          ROOT="$(find work -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"

          echo "OPENWRT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Restore executable permissions
        working-directory: ${{ env.OPENWRT_ROOT }}
        run: |
          chmod +x scripts/feeds

          find . -type f \( \
            -name "*.sh" -o \
            -name "*.pl" -o \
            -name "config.guess" -o \
            -name "config.sub" \
          \) -exec chmod u+x {} +

      
      - name: Install XMC patch
        shell: bash
        run: |
          set -e

          echo "Memeriksa folder patches..."
          find "$GITHUB_WORKSPACE/patches" -maxdepth 2 -type f -print

          PATCH="$(find "$GITHUB_WORKSPACE/patches" -maxdepth 2 -type f \
            -iname '*xmc*xm25qh32d*.patch' | head -n 1)"

          if [ -z "$PATCH" ]; then
            echo "::error::File patch XMC tidak ditemukan."
            exit 1
          fi

          echo "Patch ditemukan: $PATCH"

          if ! grep -qi '204016' "$PATCH"; then
            echo "::error::JEDEC ID 204016 tidak ditemukan dalam patch."
            cat "$PATCH"
            exit 1
          fi

          DEST="$OPENWRT_ROOT/target/linux/generic/pending-4.14"
          mkdir -p "$DEST"

          cp patches/481-mtd-spi-nor-add-xmc-xm25qh32d.patch \

          echo "Patch berhasil disalin:"
          ls -l "$DEST/481-mtd-spi-nor-add-xmc-xm25qh32d.patch"

      - name: Verify WR840N V6.2 profile
        working-directory: ${{ env.OPENWRT_ROOT }}
        run: |
          grep -q 'define Device/tl-wr840n-v6.2' \
            target/linux/ramips/image/mt76x8.mk

          echo "WR840N V6.2 profile ditemukan"
          echo "XMC patch ditemukan"

      - name: Update feeds
        working-directory: ${{ env.OPENWRT_ROOT }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      
      - name: Configure target
        working-directory: ${{ env.OPENWRT_ROOT }}
        shell: bash
        run: |
          set -e

          cp "$GITHUB_WORKSPACE/config.seed" .config
          make defconfig

          echo "===== TARGET CONFIGURATION ====="
          grep -E 'CONFIG_TARGET|WR840N|wr840n' .config || true

          echo "===== AVAILABLE WR840N PROFILES ====="
          grep -in 'wr840n' target/linux/ramips/image/mt76x8.mk || true

          grep -q '^CONFIG_TARGET_ramips=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt76x8=y' .config

          echo "Target ramips MT76x8 berhasil diperiksa."

      - name: Prepare kernel and apply patches
        working-directory: ${{ env.OPENWRT_ROOT }}
        run: |
          make target/linux/prepare V=s

      - name: Build firmware
        working-directory: ${{ env.OPENWRT_ROOT }}
        run: |
          make -j2 V=s

      - name: Collect firmware
        run: |
          mkdir -p output

          IMAGE_DIR="$OPENWRT_ROOT/bin/targets/ramips/mt76x8"

          find "$IMAGE_DIR" -maxdepth 1 -type f \
            \( \
              -iname '*wr840n*v6.2*sysupgrade.bin' -o \
              -iname '*wr840n*v6.2*tftp-recovery.bin' -o \
              -iname '*wr840n*v6.2*factory.bin' \
            \) \
            -exec cp -v {} output/ \;

          test -n "$(find output -type f -name '*.bin' -print -quit)"
          ls -lh output

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WR840N-V6.2-XMC-Firmware
          path: output/*.bin
          if-no-files-found: error
          retention-days: 30
