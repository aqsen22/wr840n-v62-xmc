
name: Build WR840N V6.2 XMC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev \
            python2 python2.7 python3 python3-distutils \
            rsync unzip zlib1g-dev file wget perl \
            libelf-dev ecj fastjar java-propose-classpath

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python --version
          python2 --version

      - name: Extract OpenWrt source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work
          unzip -q source/openwrt-19.07-tl-wr840n-v6.x-main.zip -d work

          ROOT="$(find work -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"

          echo "OPENWRT_ROOT=$GITHUB_WORKSPACE/$ROOT" >> "$GITHUB_ENV"

      - name: Restore executable permissions
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$(find work -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          echo "Memulihkan izin skrip..."

          find scripts -type f -exec chmod u+x {} +

          find . -type f \( \
            -name "*.sh" -o \
            -name "*.pl" -o \
            -name "config.guess" -o \
            -name "config.sub" \
          \) -exec chmod u+x {} +

          if [ -f scripts/ipkg-build ]; then
            chmod u+x scripts/ipkg-build
            test -x scripts/ipkg-build
          fi

          echo "Pemulihan izin selesai."

      - name: Verify WR840N V6.2 profile
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"

          grep -q 'define Device/tl-wr840n-v6.2' \
            target/linux/ramips/image/mt76x8.mk

          echo "Profil WR840N V6.2 ditemukan."

      - name: Update feeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      
      - name: Configure target
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"

          echo "Membuat konfigurasi dasar..."
          cp "$GITHUB_WORKSPACE/config.seed" .config
          make defconfig

          echo "Mencari simbol perangkat WR840N V6.2..."
          TARGET_CONFIG="tmp/.config-target.in"

          if [ ! -f "$TARGET_CONFIG" ]; then
            echo "::error::File konfigurasi target tidak ditemukan."
            exit 1
          fi

          echo "===== REFERENSI WR840N ====="
          grep -in -B 2 -A 3 'wr840n' "$TARGET_CONFIG" || true

          SYMBOL="$(grep -E '^config TARGET_.*wr840n.*v6_2' "$TARGET_CONFIG" \
            | head -n 1 | awk '{print $2}')"

          if [ -z "$SYMBOL" ]; then
            echo "::error::Simbol WR840N V6.2 tidak ditemukan."
            exit 1
          fi

          echo "Simbol ditemukan: $SYMBOL"

          sed -i '/^CONFIG_TARGET_ramips_mt76x8_DEVICE_.*=y/d' .config
          echo "CONFIG_${SYMBOL}=y" >> .config

          echo "Menjalankan konfigurasi ulang..."
          make defconfig

          echo "===== HASIL KONFIGURASI ====="
          grep -E '^CONFIG_TARGET_(ramips|ramips_mt76x8)' .config
          grep "^CONFIG_${SYMBOL}=y$" .config

          grep -q '^CONFIG_TARGET_ramips=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt76x8=y' .config
          grep -q "^CONFIG_${SYMBOL}=y$" .config

          echo "Profil WR840N V6.2 berhasil dipilih."

      - name: Prepare kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"

          make target/linux/prepare V=s

      - name: Add XMC XM25QH32D support
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"

          SPI_NOR="$(find build_dir -type f \
            -path '*/drivers/mtd/spi-nor/spi-nor.c' | head -n 1)"

          if [ -z "$SPI_NOR" ]; then
            echo "::error::File spi-nor.c tidak ditemukan."
            exit 1
          fi

          echo "File kernel: $SPI_NOR"

          python3 - "$SPI_NOR" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r") as f:
              lines = f.readlines()

          if any("0x204016" in line for line in lines):
              print("JEDEC ID XMC sudah tersedia.")
              sys.exit(0)

          for i, line in enumerate(lines):
              if '"XM25QH128A"' in line:
                  indent = line[:len(line) - len(line.lstrip())]

                  entry = (
                      indent +
                      '{ "XM25QH32D", INFO(0x204016, 0, '
                      '64 * 1024, 64, SECT_4K) },\n'
                  )

                  lines.insert(i + 1, entry)

                  with open(path, "w") as f:
                      f.writelines(lines)

                  print("Dukungan XMC XM25QH32D berhasil ditambahkan.")
                  break
          else:
              print("Entri XM25QH128A tidak ditemukan.")
              sys.exit(1)
          PY

          grep -n 'XM25QH32D' "$SPI_NOR"
          grep -q '0x204016' "$SPI_NOR"

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"

          make -j2 V=s

      - name: Collect firmware
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          IMAGE_DIR="$OPENWRT_ROOT/bin/targets/ramips/mt76x8"

          if [ ! -d "$IMAGE_DIR" ]; then
            echo "::error::Folder hasil firmware tidak ditemukan."
            exit 1
          fi

          find "$IMAGE_DIR" -maxdepth 1 -type f \
            \( \
              -iname '*wr840n*v6.2*sysupgrade.bin' -o \
              -iname '*wr840n*v6.2*tftp-recovery.bin' -o \
              -iname '*wr840n*v6.2*factory.bin' \
            \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;

          if ! find "$GITHUB_WORKSPACE/output" \
            -type f -name '*.bin' -print -quit | grep -q .; then
            echo "::error::Firmware BIN tidak ditemukan."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WR840N-V6.2-XMC-Firmware
          path: output/*.bin
          if-no-files-found: error
          retention-days: 30
