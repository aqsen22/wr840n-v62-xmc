
name: Build WR840N V6.2 XMC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev \
            python3 python3-distutils rsync unzip \
            zlib1g-dev file wget perl libelf-dev \
            ecj fastjar java-propose-classpath

      - name: Extract OpenWrt source
        run: |
          mkdir -p work
          unzip -q source/openwrt-19.07-tl-wr840n-v6.x-main.zip -d work

          ROOT="$(find work -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: Source OpenWrt tidak ditemukan"
            exit 1
          fi

          echo "OPENWRT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install XMC flash patch
        run: |
          PATCH_DIR="$OPENWRT_ROOT/target/linux/generic/pending-4.14"

          test -d "$PATCH_DIR"
          test -f patches/479a-mtd-spi-nor-add-xmc-xm25qh32d.patch

          cp patches/479a-mtd-spi-nor-add-xmc-xm25qh32d.patch "$PATCH_DIR/"

          cp config.seed "$OPENWRT_ROOT/.config"

      - name: Update feeds
        run: |
          cd "$OPENWRT_ROOT"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure WR840N V6.2
        run: |
          cd "$OPENWRT_ROOT"
          make defconfig

          grep -q '^CONFIG_TARGET_ramips=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt76x8=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt76x8_DEVICE_tl-wr840n-v6_2=y' .config

          echo "WR840N V6.2 profile selected."

      - name: Prepare kernel and apply patches
        run: |
          cd "$OPENWRT_ROOT"
          make target/linux/prepare V=s

      - name: Build firmware
        run: |
          cd "$OPENWRT_ROOT"
          make -j2 V=s

      - name: Collect firmware
        run: |
          mkdir -p output

          IMAGE_DIR="$OPENWRT_ROOT/bin/targets/ramips/mt76x8"

          find "$IMAGE_DIR" -maxdepth 1 -type f \
            -iname '*wr840n*v6.2*.bin' \
            -exec cp -v {} output/ \;

          if [ -z "$(find output -type f -name '*.bin' -print -quit)" ]; then
            echo "ERROR: Firmware WR840N V6.2 tidak ditemukan"
            ls -lah "$IMAGE_DIR"
            exit 1
          fi

          ls -lh output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: WR840N-V6.2-XMC-Firmware
          path: output/*.bin
          if-no-files-found: error
          retention-days: 30
