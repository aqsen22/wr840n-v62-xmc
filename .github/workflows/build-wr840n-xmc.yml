
name: Build WR840N V6.2 XMC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev \
            python2 python2.7 python3 python3-distutils \
            rsync unzip zlib1g-dev file wget perl \
            libelf-dev ecj fastjar java-propose-classpath

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          python --version
          python2 --version

      - name: Extract OpenWrt source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work

          unzip -q \
            source/openwrt-19.07-tl-wr840n-v6.x-main.zip \
            -d work

          ROOT="$(find work -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [ -z "$ROOT" ]; then
            echo "::error::Folder source OpenWrt tidak ditemukan."
            exit 1
          fi

          echo "OPENWRT_ROOT=$GITHUB_WORKSPACE/$ROOT" >> "$GITHUB_ENV"

          echo "Source OpenWrt: $ROOT"

      - name: Restore executable permissions
        shell: bash
        run: |
          set -euo pipefail

          cd "$OPENWRT_ROOT"

          chmod +x scripts/feeds

          find . -type f \( \
            -name "*.sh" -o \
            -name "*.pl" -o \
            -name "config.guess" -o \
            -name "config.sub" \
          \) -exec chmod u+x {} +

      - name: Install XMC patch
        shell: bash
        run: |
          set -euo pipefail

          echo "Memeriksa folder patch..."

          find "$GITHUB_WORKSPACE/patches" \
            -maxdepth 2 -type f -print

          PATCH="$GITHUB_WORKSPACE/patches/481-mtd-spi-nor-add-xmc-xm25qh32d.patch"

          if [ ! -f "$PATCH" ]; then
            echo "::error::Patch 481 tidak ditemukan."
            exit 1
          fi

          if ! grep -qi '204016' "$PATCH"; then
            echo "::error::JEDEC ID XMC tidak ditemukan."
            exit 1
          fi

          DEST="$OPENWRT_ROOT/target/linux/generic/pending-4.14"

          mkdir -p "$DEST"

          cp "$PATCH" \
            "$DEST/481-mtd-spi-nor-add-xmc-xm25qh32d.patch"

          echo "Memeriksa hasil penyalinan..."

          test -f "$DEST/481-mtd-spi-nor-add-xmc-xm25qh32d.patch"

          ls -lh "$DEST/481-mtd-spi-nor-add-xmc-xm25qh32d.patch"

      - name: Verify WR840N V6.2 profile
        shell: bash
        run: |
          set -euo pipefail

          cd "$OPENWRT_ROOT"

          PROFILE="target/linux/ramips/image/mt76x8.mk"

          if ! grep -q 'define Device/tl-wr840n-v6.2' "$PROFILE"; then
            echo "::error::Profil WR840N V6.2 tidak ditemukan."
            exit 1
          fi

          echo "Profil WR840N V6.2 ditemukan."

      - name: Update feeds
        shell: bash
        run: |
          set -euo pipefail

          cd "$OPENWRT_ROOT"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        shell: bash
        run: |
          set -euo pipefail

          cd "$OPENWRT_ROOT"

          cp "$GITHUB_WORKSPACE/config.seed" .config

          make defconfig

          echo "===== TARGET CONFIGURATION ====="

          grep -E '^CONFIG_TARGET' .config || true

          echo "===== WR840N DEVICE SELECTION ====="

          grep -i 'wr840n' .config || true

          if ! grep -q '^CONFIG_TARGET_ramips=y' .config; then
            echo "::error::Target ramips belum aktif."
            exit 1
          fi

          if ! grep -q '^CONFIG_TARGET_ramips_mt76x8=y' .config; then
            echo "::error::Target MT76x8 belum aktif."
            exit 1
          fi

          if ! grep -Eqi '^CONFIG_TARGET_ramips_mt76x8_DEVICE_.*wr840n.*=y' .config; then
            echo "::error::Profil perangkat WR840N belum dipilih di config.seed."
            exit 1
          fi

          echo "Konfigurasi target berhasil diperiksa."

      - name: Prepare kernel and apply patches
        shell: bash
        run: |
          set -euo pipefail

          cd "$OPENWRT_ROOT"

          make target/linux/prepare V=s

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail

          cd "$OPENWRT_ROOT"

          make -j2 V=s

      - name: Collect firmware
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          IMAGE_DIR="$OPENWRT_ROOT/bin/targets/ramips/mt76x8"

          if [ ! -d "$IMAGE_DIR" ]; then
            echo "::error::Folder hasil firmware tidak ditemukan."
            exit 1
          fi

          find "$IMAGE_DIR" -maxdepth 1 -type f \
            \( \
              -iname '*wr840n*v6.2*sysupgrade.bin' -o \
              -iname '*wr840n*v6.2*tftp-recovery.bin' -o \
              -iname '*wr840n*v6.2*factory.bin' \
            \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;

          if ! find "$GITHUB_WORKSPACE/output" \
            -type f -name '*.bin' -print -quit | grep -q .; then
            echo "::error::Tidak ada firmware BIN yang berhasil dikumpulkan."
            exit 1
          fi

          echo "===== HASIL FIRMWARE ====="

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WR840N-V6.2-XMC-Firmware
          path: output/*.bin
          if-no-files-found: error
          retention-days: 30
